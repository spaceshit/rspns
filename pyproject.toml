[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rspns"
version = "0.1.0"
description = "Reduce HTTP bodies for LLMs while preserving HTML, JSON, XML and JavaScript formats"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["http", "html", "json", "xml", "javascript", "llm", "security", "summarization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.12,<5", "html5lib>=1.1,<2", "lxml>=5,<7",
  "tree-sitter>=0.25,<0.27", "tree-sitter-javascript>=0.23,<0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/rspns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
